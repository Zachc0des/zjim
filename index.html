<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Zjim — training log & content vault. Gym pics, form breakdowns, the apps I actually use, and the gear worth buying.">
<meta name="theme-color" content="#f3f5f7">
<title>Zjim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@100;200;300;400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3f5f7; --panel:#fff; --ink:#0d1014; --mute:#6b737c; --line:#d5dae0; --acc:#2b3cff; --dim:#e8ebef;
  }
  body.night{
    --bg:#090b0f; --panel:#10131a; --ink:#eef1f5; --mute:#838c98; --line:#222833; --acc:#8fa2ff; --dim:#161a22;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Sora',system-ui,sans-serif; font-weight:300; font-size:15px; line-height:1.6;
    -webkit-font-smoothing:antialiased; min-height:100vh; overflow-x:hidden;
    transition:background .3s, color .3s;
  }
  ::selection{background:var(--acc); color:#fff;}
  a{color:inherit;}
  button{font:inherit; color:inherit; background:none; border:0; cursor:pointer; padding:0;}
  img,video{max-width:100%;}
  :focus-visible{outline:2px solid var(--acc); outline-offset:3px;}

  /* ---------- SHELL ---------- */
  .shell{display:grid; grid-template-columns:250px 1fr; min-height:100vh;}
  aside{
    position:sticky; top:0; height:100vh; padding:36px 28px;
    display:flex; flex-direction:column; border-right:1px solid var(--line);
  }
  .brand{font-weight:100; font-size:44px; letter-spacing:.04em; line-height:1; margin:0 0 6px;}
  .brand i{font-style:normal; color:var(--acc);}
  .tag{color:var(--mute); font-size:13px; margin:0 0 44px;}
  nav.tabs{display:flex; flex-direction:column; gap:2px;}
  .tab-btn{
    display:flex; justify-content:space-between; align-items:baseline;
    padding:9px 0; font-size:15px; color:var(--mute); text-align:left;
    border-bottom:1px solid transparent; transition:color .2s;
  }
  .tab-btn em{font-style:normal; font-size:12px; font-variant-numeric:tabular-nums;}
  .tab-btn:hover{color:var(--ink);}
  .tab-btn.active{color:var(--ink); font-weight:400;}
  .tab-btn.active em{color:var(--acc);}
  .side-foot{margin-top:auto; display:flex; flex-direction:column; gap:14px; font-size:13px; color:var(--mute);}
  .mode-toggle{
    align-self:flex-start; border:1px solid var(--line); padding:7px 16px; border-radius:99px;
    font-size:13px; color:var(--ink); transition:border-color .2s;
  }
  .mode-toggle:hover{border-color:var(--acc);}

  /* ---------- MAIN ---------- */
  main{padding:44px 48px 96px; min-width:0;}
  .panel{display:none;}
  .panel.active{display:block;}
  .head{display:flex; align-items:flex-end; justify-content:space-between; gap:24px; flex-wrap:wrap; margin-bottom:30px;}
  .head h2{font-weight:100; font-size:clamp(40px,7vw,84px); line-height:1; letter-spacing:.01em; margin:0;}
  .head p{max-width:340px; margin:0; color:var(--mute); font-size:14px;}
  .filters{display:flex; gap:22px; flex-wrap:wrap; padding:14px 0; margin-bottom:30px; border-top:1px solid var(--line); border-bottom:1px solid var(--line);}
  .filter-btn{font-size:14px; color:var(--mute); padding:2px 0; border-bottom:1px solid transparent; transition:color .2s, border-color .2s;}
  .filter-btn:hover{color:var(--ink);}
  .filter-btn.active{color:var(--ink); border-color:var(--acc);}

  /* ---------- FEED ---------- */
  .feed{columns:5 160px; column-gap:16px;}
  .card{break-inside:avoid; margin-bottom:24px;}
  .media{position:relative; width:100%; aspect-ratio:4/5; overflow:hidden; background:var(--dim);}
  .media.is-preview{aspect-ratio:16/11; cursor:zoom-in;}
  .media img,.media video{width:100%; height:100%; display:block; object-fit:cover; filter:grayscale(.9) contrast(1.05); transition:filter .4s;}
  .card:hover .media img,.card:hover .media video{filter:none;}
  .media iframe{position:absolute; top:0; left:0; border:0; transform-origin:top left; pointer-events:none; background:#fff;}
  /* corner brackets */
  .media::before,.media::after{
    content:''; position:absolute; width:14px; height:14px; z-index:2; pointer-events:none; opacity:0; transition:opacity .25s;
  }
  .media::before{top:10px; left:10px; border-top:1px solid #fff; border-left:1px solid #fff;}
  .media::after{bottom:10px; right:10px; border-bottom:1px solid #fff; border-right:1px solid #fff;}
  .card:hover .media::before,.card:hover .media::after{opacity:1;}
  .cap{display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding-top:12px;}
  .cap b{font-weight:400; font-size:13.5px;}
  .cap span,.cap a{font-size:11.5px; color:var(--mute); text-decoration:none; white-space:nowrap;}
  .cap a{border-bottom:1px solid var(--line);}
  .cap a:hover{color:var(--acc); border-color:var(--acc);}

  /* ---------- ITEMS ---------- */
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line);}
  .item{background:var(--bg); padding:26px; display:flex; flex-direction:column; min-height:200px; transition:background .25s;}
  .item:hover{background:var(--panel);}
  .item .thumb{width:100%; max-height:110px; object-fit:cover; margin-bottom:14px; filter:grayscale(.9);}
  .item .top{display:flex; gap:14px; align-items:center; margin-bottom:12px;}
  .mono{
    width:38px; height:38px; flex-shrink:0; display:grid; place-items:center;
    border:1px solid var(--line); border-radius:50%; font-weight:200; font-size:17px; color:var(--acc);
  }
  .item h3{font-weight:400; font-size:18px; line-height:1.25; margin:0;}
  .item small{display:block; color:var(--mute); font-size:12.5px; margin-top:2px;}
  .item p{color:var(--mute); margin:0 0 18px;}
  .item .go{margin-top:auto; font-size:13px; text-decoration:none; align-self:flex-start; border-bottom:1px solid var(--line);}
  .item .go:hover{color:var(--acc); border-color:var(--acc);}

  .empty{padding:72px 0; max-width:380px;}
  .empty h3{font-weight:200; font-size:30px; margin:0 0 8px;}
  .empty p{color:var(--mute); margin:0;}

  /* ---------- LIGHTBOX ---------- */
  .lightbox{position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center; padding:28px; background:color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter:blur(8px);}
  .lightbox.open{display:flex;}
  .lb-frame{position:relative; width:min(1100px,100%); height:min(80vh,780px); background:#fff; border:1px solid var(--line);}
  .lb-frame iframe{width:100%; height:100%; border:0; display:block;}
  .lb-close{position:absolute; top:-40px; right:0; font-size:13px; border:1px solid var(--line); border-radius:99px; padding:6px 16px; background:var(--panel);}
  .lb-close:hover{border-color:var(--acc);}

  /* ---------- MOBILE ---------- */
  @media (max-width:860px){
    .shell{display:block;}
    aside{position:sticky; z-index:8; height:auto; flex-direction:row; align-items:center; gap:16px; padding:12px 18px; border-right:0; border-bottom:1px solid var(--line); background:color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter:blur(10px);}
    .brand{font-size:26px; margin:0;}
    .tag,.side-foot span{display:none;}
    nav.tabs{flex-direction:row; gap:16px; overflow-x:auto; scrollbar-width:none; flex:1;}
    nav.tabs::-webkit-scrollbar{display:none;}
    .tab-btn{white-space:nowrap; gap:6px;}
    .side-foot{margin:0;}
    main{padding:30px 18px 72px;}
  }
  @media (max-width:700px){ .feed{columns:2;} }
  @media (prefers-reduced-motion:reduce){ *{transition:none !important;} }
</style>
</head>
<body>
<div class="shell">
  <aside>
    <div>
      <h1 class="brand">zjim<i>.</i></h1>
      <p class="tag">Training log and content vault</p>
    </div>
    <nav class="tabs" id="tabs"></nav>
    <div class="side-foot">
      <span id="logged"></span>
      <button class="mode-toggle" id="modeToggle" type="button">Night mode</button>
    </div>
  </aside>
  <main id="panels"></main>
</div>

<div class="lightbox" id="lightbox">
  <div class="lb-frame">
    <button class="lb-close" id="lbClose" type="button">Close</button>
    <iframe id="lbFrame" src="about:blank" title="Guide preview"></iframe>
  </div>
</div>

<script>
(function(){
  /* =================================================================
     CONTENT — edit these arrays to add, remove or change entries.
     FEED  type: 'image' | 'video' | 'html'
       'html' = live scaled preview of that .html file, opens in lightbox.
     Videos filter = your own clips only. category:'guide' → Guides,
     category:'pinterest' → Pinterest finds, anything else → Videos.
     ================================================================= */
  const POSTS = [
    { id:1, url:'videos/JULY27CRUNCH smaller siZe.mp4', type:'video', caption:'Full Body Circuit.', category:'Videos', source:'' },
    { id:3, url:'videos/august1crunchsmall.mp4', type:'video', caption:'Full Body Circuit.', category:'Videos', source:'' },
    { id:4, url:'pinterst/1.mp4', type:'video', caption:'Find Number One', category:'pinterest', source:'' },
    { id:5, url:'pinterst/2.mp4', type:'video', caption:'Find Number Two', category:'pinterest', source:'' },
    { id:6, url:'pinterst/3.mp4', type:'video', caption:'Find Number Three', category:'pinterest', source:'' },
    { id:7, url:'guides/ppl.html', type:'html', caption:'ppl', category:'guide', source:'' },
    { id:8, url:'guides/wguide.html', type:'html', caption:'routine', category:'guide', source:'' },
    { id:9, url:'guides/wsy.html', type:'html', caption:'post workout stretch', category:'guide', source:'' },
    { id:10, url:'pics/red.jpg', type:'image', caption:'core #1', category:'gym', source:'' },
    // { id:11, url:'https://...jpg', type:'image', caption:'Leg day.', category:'gym', source:'' },
    // { id:12, url:'https://...mp4', type:'video', caption:'Form check.', category:'guide', source:'' },
    // { id:13, url:'guides/progressive-overload.html', type:'html', caption:'Progressive overload, explained.', category:'guide', source:'' },
  ];

  // APPS — training | nutrition | recovery | mindset
  const APPS = [
    { id:'a1', name:'Strong', category:'training', desc:'Dead-simple workout logger — plates, reps, and rest timers without the social-feed noise.', link:'https://www.strong.app/' },
    { id:'a2', name:'MyFitnessPal', category:'nutrition', desc:'Food logging that actually has a barcode scanner people use. Good for dialing in a first cut or bulk.', link:'https://www.myfitnesspal.com/' },
    { id:'a3', name:'Insight Timer', category:'mindset', desc:'Free guided breathing and grounding sessions — solid for pre-gym nerves or slowing down after a bad set.', link:'https://insighttimer.com/' },
    { id:'a4', name:'Hevy', category:'recovery', desc:'Tracks volume trends over time so you can actually see when it\'s time to deload.', link:'https://www.hevyapp.com/' }
  ];

  // GEAR — home-gym | recovery | apparel | tech
  const GEAR = [
    { id:'g1', name:'Resistance bands set', image:'', category:'home-gym', desc:'Zero-intimidation entry point — warm up, add tension, or train a full session at home with no rack required.', link:'' },
    { id:'g2', name:'Lifting straps', image:'', category:'home-gym', desc:'Grip gives out before your back does. Straps let you actually finish the pull.', link:'' },
    { id:'g3', name:'Foam roller', image:'', category:'recovery', desc:'Cheapest recovery tool that actually works. Ten minutes before bed on a heavy leg day.', link:'' },
    { id:'g4', name:'Moisture-wicking tee', image:'', category:'apparel', desc:'Boring but true: a shirt that doesn\'t stick to you makes it easier to actually show up.', link:'' }
  ];

  // FUEL — meal-prep | recipe | guide | supplement
  const FUEL = [
    { id:'f1', name:'Sunday chicken, rice & veg prep', image:'', category:'meal-prep', desc:'Five containers, one hour. Chicken thighs, jasmine rice, roasted broccoli — boring on purpose so you actually eat it all week.', link:'' },
    { id:'f2', name:'High-protein overnight oats', image:'', category:'recipe', desc:'Oats, protein powder, chia, milk of choice — mix at night, eat before the gym. No cooking required.', link:'' },
    { id:'f3', name:'How to read a nutrition label', image:'', category:'guide', desc:'The basics that actually matter — serving size tricks, added sugar, and why "protein per calorie" beats total protein.', link:'' },
    { id:'f4', name:'Creatine monohydrate', image:'', category:'supplement', desc:'Cheapest, most-studied supplement out there. 5g a day, no loading phase needed, no timing games.', link:'' }
  ];

  // RECOVERY — yoga | mobility | sleep | active
  const RECOVERY = [
    { id:'r1', name:'15-min post-leg-day yoga flow', image:'', category:'yoga', desc:'Slow hip openers and forward folds to unlock everything squats just tightened up. No experience needed, just a mat and the floor.', link:'' },
    { id:'r2', name:'Morning yoga for gym anxiety', image:'', category:'yoga', desc:'A short breath-led flow before you even think about the gym. Settles the nervous system before it has a chance to spiral.', link:'' },
    { id:'r3', name:'Hip & ankle mobility routine', image:'', category:'mobility', desc:'Five minutes a day fixes squat depth faster than any amount of extra sets. Do it on rest days, do it every day.', link:'' },
    { id:'r4', name:'Sleep hygiene basics', image:'', category:'sleep', desc:'Consistent wake time, no screens the last 30 minutes, cool dark room. Recovery happens here more than anywhere in the gym.', link:'' },
    { id:'r5', name:'Active recovery walk', image:'', category:'active', desc:'20–30 minutes at an easy pace on off days. Gets blood moving without adding fatigue on top of fatigue.', link:'' }
  ];

  const SECTIONS = [
    { k:'feed', t:'Feed', h:'Gym pics, form breakdowns and Pinterest finds, newest first.', d:POSTS,
      f:[['all','All'],['gym','Gym pics'],['video','Videos'],['guide','Guides & tutorials'],['pinterest','Pinterest finds']],
      e:['Nothing posted yet','Add a gym pic, video or Pinterest find to start the feed.'] },
    { k:'apps', t:'Apps', h:'What\'s on my phone: logging workouts, keeping food honest, and easing gym nerves.', d:APPS,
      f:[['all','All'],['training','Training'],['nutrition','Nutrition'],['recovery','Recovery'],['mindset','Mindset']],
      e:['No apps saved yet','Add the apps you use for training, food or recovery.'] },
    { k:'gear', t:'Gear', h:'Equipment worth buying, from home gym basics to the wishlist.', d:GEAR, cta:'Where to get it',
      f:[['all','All'],['home-gym','Home gym'],['recovery','Recovery'],['apparel','Apparel'],['tech','Tech']],
      e:['No gear saved yet','Add equipment or apparel you would recommend.'] },
    { k:'fuel', t:'Fuel', h:'Meal prep that happens, nutrition guides worth rereading, and supplements that earned a spot.', d:FUEL, cta:'Open',
      f:[['all','All'],['meal-prep','Meal prep'],['recipe','Recipes'],['guide','Nutrition guides'],['supplement','Supplements']],
      e:['No fuel saved yet','Add a meal prep routine, recipe, guide or supplement.'] },
    { k:'recovery', t:'Recovery', h:'Yoga, mobility, sleep and easy-day movement that lets the gains happen.', d:RECOVERY, cta:'Open',
      f:[['all','All'],['yoga','Yoga'],['mobility','Stretching & mobility'],['sleep','Sleep'],['active','Active recovery']],
      e:['Nothing logged yet','Add a yoga flow, mobility routine, sleep habit or active recovery idea.'] }
  ];

  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const esc = s => { const d = document.createElement('div'); d.innerText = s == null ? '' : s; return d.innerHTML; };
  const active = {};
  SECTIONS.forEach(s => active[s.k] = 'all');

  /* ---------- BUILD SHELL ---------- */
  const tabsEl = $('#tabs'), panelsEl = $('#panels');
  SECTIONS.forEach((s, i) => {
    const b = document.createElement('button');
    b.className = 'tab-btn' + (i === 0 ? ' active' : '');
    b.dataset.section = s.k;
    b.innerHTML = `${s.t}<em>${s.d.length}</em>`;
    tabsEl.appendChild(b);

    const p = document.createElement('section');
    p.className = 'panel' + (i === 0 ? ' active' : '');
    p.dataset.panel = s.k;
    p.innerHTML = `
      <div class="head"><h2>${s.t}</h2><p>${esc(s.h)}</p></div>
      <div class="filters">${s.f.map((f, j) => `<button class="filter-btn${j === 0 ? ' active' : ''}" data-filter="${f[0]}">${esc(f[1])}</button>`).join('')}</div>
      <div class="${s.k === 'feed' ? 'feed' : 'grid'}" id="out-${s.k}"></div>
      <div class="empty" id="empty-${s.k}" style="display:none"><h3>${esc(s.e[0])}</h3><p>${esc(s.e[1])}</p></div>`;
    panelsEl.appendChild(p);
  });
  $('#logged').textContent = POSTS.length + ' posts logged';

  tabsEl.addEventListener('click', e => {
    const b = e.target.closest('.tab-btn'); if (!b) return;
    $$('.tab-btn').forEach(x => x.classList.toggle('active', x === b));
    $$('.panel').forEach(p => p.classList.toggle('active', p.dataset.panel === b.dataset.section));
    window.scrollTo({ top: 0 });
    scalePreviewFrames();
  });

  $$('.panel').forEach(panel => {
    const k = panel.dataset.panel;
    panel.addEventListener('click', e => {
      const b = e.target.closest('.filter-btn'); if (!b) return;
      $$('.filter-btn', panel).forEach(x => x.classList.toggle('active', x === b));
      active[k] = b.dataset.filter;
      render(k);
    });
  });

  /* ---------- DAY / NIGHT ---------- */
  const modeBtn = $('#modeToggle');
  modeBtn.addEventListener('click', () => {
    const night = document.body.classList.toggle('night');
    modeBtn.textContent = night ? 'Day mode' : 'Night mode';
    $('meta[name="theme-color"]').setAttribute('content', night ? '#090b0f' : '#f3f5f7');
  });

  /* ---------- FEED ---------- */
  const isGuide = p => p.type === 'html' || p.category === 'guide';
  const tagLabel = p => isGuide(p) ? 'Guide' : p.type === 'video' ? (p.category === 'pinterest' ? 'Pinterest find' : 'Video') : p.category === 'pinterest' ? 'Pinterest find' : 'Gym pic';

  function renderFeed(){
    const f = active.feed, out = $('#out-feed');
    const list = POSTS.filter(p => {
      if (f === 'all') return true;
      if (f === 'video') return p.type === 'video' && !isGuide(p) && p.category !== 'pinterest';
      if (f === 'guide') return isGuide(p);
      return p.category === f;
    });
    out.innerHTML = '';
    $('#empty-feed').style.display = list.length ? 'none' : 'block';

    list.slice().reverse().forEach(p => {
      const card = document.createElement('article');
      card.className = 'card';
      let media;
      if (p.type === 'video') media = `<div class="media"><video src="${esc(p.url)}" controls playsinline></video></div>`;
      else if (p.type === 'html') media = `<div class="media is-preview"><iframe data-scale src="${esc(p.url)}" loading="lazy" tabindex="-1" title="${esc(p.caption || 'Guide preview')}"></iframe></div>`;
      else media = `<div class="media"><img src="${esc(p.url)}" alt="${esc(p.caption || '')}" loading="lazy" onerror="this.parentElement.style.display='none'"></div>`;

      const src = p.source
        ? `<a href="${esc(p.source)}" target="_blank" rel="noopener">Source</a>`
        : p.type === 'html' ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">Open guide</a>` : `<span>${tagLabel(p)}</span>`;

      card.innerHTML = `${media}<div class="cap"><b>${esc(p.caption || '')}</b>${src}</div>`;
      if (p.type === 'html') $('.media', card).addEventListener('click', () => openLb(p.url, p.caption));
      out.appendChild(card);
    });
    scalePreviewFrames();
  }

  function scalePreviewFrames(){
    const W = 1280, H = 800;
    $$('.media iframe[data-scale]').forEach(fr => {
      const box = fr.parentElement;
      const fit = () => {
        const w = box.clientWidth; if (!w) return;
        fr.style.width = W + 'px'; fr.style.height = H + 'px';
        fr.style.transform = 'scale(' + (w / W) + ')';
      };
      fit();
      if (window.ResizeObserver && !box._ro){ box._ro = new ResizeObserver(fit); box._ro.observe(box); }
    });
  }

  /* ---------- LIGHTBOX ---------- */
  const lb = $('#lightbox'), lbFrame = $('#lbFrame');
  function openLb(url, title){
    lbFrame.src = url; lbFrame.title = title || 'Guide preview';
    lb.classList.add('open'); document.body.style.overflow = 'hidden';
  }
  function closeLb(){
    lb.classList.remove('open'); lbFrame.src = 'about:blank'; document.body.style.overflow = '';
  }
  $('#lbClose').addEventListener('click', closeLb);
  lb.addEventListener('click', e => { if (e.target === lb) closeLb(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLb(); });

  /* ---------- ITEM GRIDS (apps / gear / fuel / recovery) ---------- */
  function renderItems(s){
    const f = active[s.k], out = $('#out-' + s.k);
    const labels = {}; s.f.forEach(x => labels[x[0]] = x[1]);
    const list = s.d.filter(x => f === 'all' || x.category === f);
    out.innerHTML = '';
    $('#empty-' + s.k).style.display = list.length ? 'none' : 'block';

    list.slice().reverse().forEach(x => {
      const el = document.createElement('article');
      el.className = 'item';
      const thumb = x.image ? `<img class="thumb" src="${esc(x.image)}" alt="" loading="lazy" onerror="this.style.display='none'">` : '';
      const mono = s.k === 'apps' ? `<span class="mono">${esc(x.name.charAt(0))}</span>` : '';
      const cta = s.cta || 'Open';
      const link = x.link ? `<a class="go" href="${esc(x.link)}" target="_blank" rel="noopener">${cta}</a>` : '';
      el.innerHTML = `${thumb}
        <div class="top">${mono}<div><h3>${esc(x.name)}</h3><small>${esc(labels[x.category] || x.category)}</small></div></div>
        ${x.desc ? `<p>${esc(x.desc)}</p>` : ''}${link}`;
      out.appendChild(el);
    });
  }

  function render(k){
    if (k === 'feed') return renderFeed();
    renderItems(SECTIONS.find(s => s.k === k));
  }
  SECTIONS.forEach(s => render(s.k));
})();
</script>
</body>
</html>
